name: CI

on:
  push:
    branches: [ "main", "entrega-intermediaria", "feature/supabase-integration" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://fake.supabase.co
      SUPABASE_KEY: fake-key

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar lint
        run: python -m ruff check .

      - name: Rodar testes
        run: PYTHONPATH=$PYTHONPATH:$(pwd) python -m pytest tests/ -v
